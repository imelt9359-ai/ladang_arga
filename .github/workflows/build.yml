name: Build APK Ladang Arga

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil file repo
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Siapkan Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4

      - name: Pasang Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36"

      - name: Siapkan file game
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            cp Ladang_Arga*.html www/index.html
          fi

      - name: Bungkus dengan Capacitor & Build APK
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap init "Ladang Arga" com.arga.ladang --web-dir www
          npx cap add android
          sed -i '0,/<activity/{s/<activity/<activity android:screenOrientation="portrait"/}' android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: ladang-arga-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
